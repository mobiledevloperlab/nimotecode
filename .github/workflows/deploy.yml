name: Deploy NimoteCode-OFFICAL SITE to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: npm ci

      - name: Build with VitePress
        run: npm run docs:build

      # Internal links, canonical URLs, titles, descriptions and hreflang must
      # be unique and resolvable before anything is published.
      - name: Check the built site
        run: npm run docs:check

      # Complete corresponding-source archives are served from Cloudflare R2.
      # docs/public/opensource/local-linux/ only publishes the metadata that
      # describes them, so the Pages artifact must stay small.
      - name: Guard the Pages artifact against source bundles
        run: |
          set -euo pipefail
          dist=docs/.vitepress/dist
          bundles=$(find "$dist" -type f -name 'nimotecode-local-linux-sources-*.tar.zst' -print)
          if [ -n "$bundles" ]; then
            echo "Source bundles are published to Cloudflare R2, not to Pages:" >&2
            printf '%s\n' "$bundles" >&2
            exit 1
          fi
          if [ -d "$dist/opensource" ]; then
            large=$(find "$dist/opensource" -type f -size +25M -print)
            if [ -n "$large" ]; then
              echo "Files over 25MB must not be published under /opensource:" >&2
              printf '%s\n' "$large" >&2
              exit 1
            fi
          fi
          echo "Pages artifact guard passed."

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/.vitepress/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4